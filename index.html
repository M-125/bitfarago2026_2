        <div
            id="game_over"
            class="hidden absolute z-10000 bg-white shadow-black shadow-md w-100 fixed left-1/2 -translate-x-1/2 top-50 p-6 rounded-lg border-black border-solid border-2"
        >
            <div class="border-b-2 border-b-solid mb-0 p-0">
                <p
                    class="text-4xl text-center font-bold lili mb-5 text-shadow-md"
                >
                    Játék vége
                </p>
            </div>
            <div
                id="score_div"
                class="bg-white shadow-black shadow-md p-2 my-2 rounded-lg border-black border-solid border-2 h-12 overflow-hidden ease-in duration-400"
            >
                <!-- JS inject -->
            </div>
            <div>
                <button
                    type="submit"
                    onclick="select_popup()"
                    id="restart_button"
                    class="justify-center m-auto flex mt-4 lili bg-black text-white p-2 text-xl rounded-lg cursor-pointer hover:bg-white hover:text-black ease-in-out duration-300 hover:outline-2 hover:outline-solid hover"
                >
                    Újrainidítás
                </button>
            </div>
        </div>

        <div

            id="selection_popup"

            <form id="initForm">
                <p class="text-4xl text-center font-bold lili mb-5">Opciók</p>
                <div class="mb-2">
                    <label
                        for="field_size_input"
                        class="text-2xl font-bold lili"
                        >Pálya hossza [10; 16]:
                    </label>
                    <input
                        id="field_size_input"
                        type="number"
                        name="field_size_input"
                        min="10"
                        max="16"
                        class="lili text-2xl"
                        value="10"
                    />
                </div>
                <div class="my-4">
                    <div>
                        <p class="lili text-2xl">Nehézségi szint:</p>
                    </div>
                    <div class="flex justify-evenly w-full">
                        <div>
                            <button
                                type="button"
                                id="dif_easy"
                                onclick="set_difficulty(this)"
                                class="bg-green-200 border-3 rounded-md px-3 py-1 border-solid border-green-600 lili text-green-600 text-lg cursor-pointer hover:bg-white ease-in-out duration-300 shadow-md/30 shadow-black"
                            >
                                LAZA
                            </button>
                        </div>
                        <div>
                            <button
                                type="button"
                                id="dif_mid"
                                onclick="set_difficulty(this)"
                                class="bg-amber-300 border-3 rounded-md px-3 py-1 border-solid border-amber-600 lili text-amber-600 text-lg cursor-pointer hover:bg-white ease-in-out duration-300 shadow-md/30 shadow-black"
                            >
                                KÖZEPES
                            </button>
                        </div>
                        <div>
                            <button
                                type="button"
                                id="dif_hard"
                                onclick="set_difficulty(this)"
                                class="bg-red-200 border-3 rounded-md px-3 py-1 border-solid border-red-600 lili text-red-600 text-lg cursor-pointer hover:bg-white ease-in-out duration-300 shadow-md/30 shadow-black"
                            >
                                NEHÉZ
                            </button>
                        </div>
                    </div>
                </div>
                <div class="align-middle flex mb-3">
                    <label for="character_color" class="text-2xl font-bold lili"

                        name="character_color"
                        id="character_color"
