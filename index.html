<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"
            crossorigin="anonymous"
            integrity=""
        ></script>
        <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
            rel="stylesheet"
        />
        <link
            rel="icon"
            sizes="48x48"
            type="image/png"
            href="https://assets.raspberrypi.com/favicon.png"
            data-gatsby-head="true"
        />
        <title>Kerti Pincék - Gyümimajszoló</title>
    </head>
    <body class="bg-blue-200/80">
        <div>
            <header>
                <h1 class="text-5xl text-center font-bold lili mt-9 mb-5">
                    Gyümimajszoló
                </h1>
            </header>
            <p id="energy"></p>
            <button onclick="eatFruit('apple')" class=" w-15 h-15"><img class="h-15" src="assets/apple.svg"/><p id="apple" class="corner lili">X</p></button>
            <button onclick="eatFruit('grape')" class=" w-15 h-15"><img class="h-15" src="assets/grape.svg"/><p id="grape" class="corner lili">X</p></button>
            <button onclick="eatFruit('pear')" class=" w-15 h-15"><img class="h-15" src="assets/pear.svg"/><p id="pear" class="corner lili">X</p></button>
            <div id="playArea" class="ring-4 m-auto w-fit"></div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
